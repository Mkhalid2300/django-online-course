{% extends "onlinecourse/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Available Courses</h2>
    <div class="list-group">
        {% for course in courses %}
            <a href="{% url 'onlinecourse:course_details' course.id %}" class="list-group-item list-group-item-action">
                {{ course.name }}
            </a>
        {% empty %}
            <p>No courses available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
