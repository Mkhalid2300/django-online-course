{% extends "onlinecourse/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Exam: {{ course.name }}</h2>
    <form action="{% url 'onlinecourse:submit' course.id %}" method="POST">
        {% csrf_token %}
        {% for question in questions %}
            <div class="card mb-3">
                <div class="card-header">
                    <strong>{{ question.question_text }}</strong> ({{ question.question_grade }} points)
                </div>
                <div class="card-body">
                    {% for choice in question.choice_set.all %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="choice" value="{{ choice.id }}" id="choice{{ choice.id }}">
                            <label class="form-check-label" for="choice{{ choice.id }}">
                                {{ choice.choice_text }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Submit Exam</button>
    </form>
</div>
{% endblock %}
